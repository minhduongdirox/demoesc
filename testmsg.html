<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Presentation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a; /* Dark background for professional look */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        .container {
            width: 80%;
            max-width: 1200px;
        }

        /* The clamp function: 
           - Minimum size: 24px (Mobile/Small Tablet)
           - Preferred size: 5vw (5% of screen width)
           - Maximum size: 80px (Large Projectors)
        */
        h1 {
            font-size: clamp(24px, 6vw, 80px);
            margin-bottom: 20px;
            color: #00d4ff;
        }

        p {
            font-size: clamp(18px, 3vw, 40px);
            line-height: 1.5;
            color: #cccccc;
        }

        /* Subtle indicator for different screens */
        @media (max-width: 768px) {
            body { border: 10px solid #333; } /* iPad/Small screen border */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Future of AI Collaboration</h1>
        <p>This text scales automatically. Open this on a laptop, then resize your browser to see the font grow and shrink in real-time.</p>
        <textarea cols="120" rows="10">Ich suche eine Allianz für niedrigere Ränge, in der ich lernen und meinem schwachen Stärkeniveau entsprechend spielen kann. Tschüss und danke für alles!</textarea>
    </div>

</body>
</html>
